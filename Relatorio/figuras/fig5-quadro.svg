<text x="380" y="88" font-family="Noto Sans, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#6b7280" font-style="italic">34 bytes no total, enviados crus pela UART2 (não como texto hexadecimal)</text>
