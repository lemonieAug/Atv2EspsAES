; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; A/B: ESP32-D0WD-V3 em modulos ESP32-WROOM-32; esp32dev e GPIO16/17 compativeis.
; Firmware atual: SOMENTE UART, sem criptografia.
[platformio]
default_envs = esp_a, esp_b
src_dir = Codigo/src
include_dir = Codigo/include

[env]
; 7.1.3 ja instalada: inclui a correcao de ELF2BINFLAGS para SCons recente.
; Ambos os builds UART validados via MCP em 18/10/2026, logs em Codigo/evidencias.
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 115200
build_flags = -D UART_RX_PIN=16 -D UART_TX_PIN=17

[env:esp_a]
; A permanece no USB location 3-3; apos reconexao de 19/10, virou ttyUSB0.
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_flags = ${env.build_flags} -D LAB_ROLE_A=1

[env:esp_b]
; B permanece no USB location 3-1; apos reconexao de 19/10, virou ttyUSB1.
upload_port = /dev/ttyUSB1
monitor_port = /dev/ttyUSB1
build_flags = ${env.build_flags} -D LAB_ROLE_A=0
