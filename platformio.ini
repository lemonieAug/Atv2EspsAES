; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; A/B: ESP32-D0WD-V3 em modulos ESP32-WROOM-32; esp32dev e GPIO16/17 compativeis.
; esp_a/esp_b: firmware do trabalho (AES-128 ECB + PKCS#7, quadro AA|n|16n).
; diag_a/diag_b: diagnostico UART PING/PONG em texto, sem criptografia.
; Grave cada ambiente individualmente; nunca as duas placas de uma vez.
[platformio]
default_envs = esp_a, esp_b
src_dir = Codigo/src
include_dir = Codigo/include

[env]
; 7.1.3 ja instalada: inclui a correcao de ELF2BINFLAGS para SCons recente.
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 115200
build_flags = -D UART_RX_PIN=16 -D UART_TX_PIN=17

[aes]
; Codigo C do AES/PKCS#7/ECB/quadro e comum as duas placas e aos testes do PC.
src_comum = +<*.c> +<comum.cpp>

[env:esp_a]
; Transmissor. A permanece no USB location 3-3; apos reconexao de 19/10, ttyUSB0.
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_src_filter = ${aes.src_comum} +<transmissor.cpp>

[env:esp_b]
; Receptor. B permanece no USB location 3-1; apos reconexao de 19/10, ttyUSB1.
upload_port = /dev/ttyUSB1
monitor_port = /dev/ttyUSB1
build_src_filter = ${aes.src_comum} +<receptor.cpp>

[env:diag_a]
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_src_filter = +<diag/uart_diag.cpp>
build_flags = ${env.build_flags} -D LAB_ROLE_A=1

[env:diag_b]
upload_port = /dev/ttyUSB1
monitor_port = /dev/ttyUSB1
build_src_filter = +<diag/uart_diag.cpp>
build_flags = ${env.build_flags} -D LAB_ROLE_A=0
