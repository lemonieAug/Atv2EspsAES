<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#FAFBFE" stroke="none" stroke-width="2"/>
<rect x="64" y="62" width="7" height="31" rx="3" fill="#2165D6" stroke="none" stroke-width="2"/>
<text fill="#2165D6" font-family="Noto Sans,sans-serif" font-size="22" font-weight="700" text-anchor="start" xml:space="preserve">
<tspan x="88" y="85">ROTEIRO PARA A SALA</tspan>
</text>
<text fill="#182B45" font-family="Noto Sans,sans-serif" font-size="52" font-weight="700" text-anchor="start" xml:space="preserve">
<tspan x="64" y="176">Demonstração ao vivo: três passos</tspan>
</text>
<text fill="#52657B" font-family="Noto Sans,sans-serif" font-size="27" font-weight="400" text-anchor="start" xml:space="preserve">
<tspan x="67" y="246">Usar os dois monitores USB a 115200 bps, com envio de linha LF.</tspan>
</text>
<rect x="64" y="327" width="460" height="300" rx="18" fill="#FFFFFF" stroke="#D7E1EE" stroke-width="2"/>
<rect x="64" y="327" width="7" height="300" rx="0" fill="#2165D6" stroke="none" stroke-width="2"/>
<text fill="#2165D6" font-family="Noto Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" xml:space="preserve">
<tspan x="89" y="382">1 · PREPARAR</tspan>
</text>
<text fill="#182B45" font-family="Noto Sans,sans-serif" font-size="28" font-weight="400" text-anchor="start" xml:space="preserve">
<tspan x="89" y="455">A e B: CHAVERESET</tspan>
<tspan x="89" y="489.72">A: MSGRESET</tspan>
<tspan x="89" y="524.44">B: aguardar PRONTO</tspan>
</text>
<rect x="570" y="327" width="460" height="300" rx="18" fill="#FFFFFF" stroke="#D7E1EE" stroke-width="2"/>
<rect x="570" y="327" width="7" height="300" rx="0" fill="#008774" stroke="none" stroke-width="2"/>
<text fill="#008774" font-family="Noto Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" xml:space="preserve">
<tspan x="595" y="382">2 · ENVIAR</tspan>
</text>
<text fill="#182B45" font-family="Noto Sans,sans-serif" font-size="28" font-weight="400" text-anchor="start" xml:space="preserve">
<tspan x="595" y="455">A: ENVIAR</tspan>
<tspan x="595" y="489.72"></tspan>
<tspan x="595" y="524.44">ou apertar BOOT</tspan>
<tspan x="595" y="559.16">após o boot normal.</tspan>
</text>
<rect x="1076" y="327" width="460" height="300" rx="18" fill="#FFFFFF" stroke="#D7E1EE" stroke-width="2"/>
<rect x="1076" y="327" width="7" height="300" rx="0" fill="#2165D6" stroke="none" stroke-width="2"/>
<text fill="#2165D6" font-family="Noto Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" xml:space="preserve">
<tspan x="1101" y="382">3 · CONFERIR</tspan>
</text>
<text fill="#182B45" font-family="Noto Sans,sans-serif" font-size="28" font-weight="400" text-anchor="start" xml:space="preserve">
<tspan x="1101" y="455">Mesmos blocos cifrados.</tspan>
<tspan x="1101" y="489.72"></tspan>
<tspan x="1101" y="524.44">Texto recuperado igual ao</tspan>
<tspan x="1101" y="559.16">original.</tspan>
</text>
<rect x="64" y="703" width="1472" height="66" rx="14" fill="#EAF1FF" stroke="none" stroke-width="2"/>
<text fill="#2165D6" font-family="Noto Sans,sans-serif" font-size="26" font-weight="700" text-anchor="start" xml:space="preserve">
<tspan x="88" y="745">Alteração na arguição: MSG &lt;novo texto&gt;. Para voltar: MSGRESET e ENVIAR.</tspan>
</text>
<line x1="64" y1="848" x2="1536" y2="848" stroke="#D7E1EE" stroke-width="1" />
<text fill="#52657B" font-family="Noto Sans,sans-serif" font-size="17" font-weight="700" text-anchor="start" xml:space="preserve">
<tspan x="65" y="878">AES-128 · AUGUSTO + GUSTAVO</tspan>
</text>
<text fill="#52657B" font-family="Noto Sans,sans-serif" font-size="18" font-weight="400" text-anchor="end" xml:space="preserve">
<tspan x="1536" y="877">18 / 27</tspan>
</text>
</svg>