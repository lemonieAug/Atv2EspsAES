<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#FAFBFE" stroke="none" stroke-width="2"/>
<rect x="64" y="62" width="7" height="31" rx="3" fill="#2165D6" stroke="none" stroke-width="2"/>
<text fill="#2165D6" font-family="Noto Sans,sans-serif" font-size="22" font-weight="700" text-anchor="start" xml:space="preserve">
<tspan x="88" y="85">ENTENDA O SISTEMA</tspan>
</text>
<text fill="#182B45" font-family="Noto Sans,sans-serif" font-size="52" font-weight="700" text-anchor="start" xml:space="preserve">
<tspan x="64" y="176">Um texto também é uma sequência de números</tspan>
</text>
<text fill="#52657B" font-family="Noto Sans,sans-serif" font-size="27" font-weight="400" text-anchor="start" xml:space="preserve">
<tspan x="67" y="246">Byte = grupo de 8 bits. Hexadecimal = uma forma curta de escrever esses números.</tspan>
</text>
<rect x="64" y="330" width="445" height="280" rx="18" fill="#FFFFFF" stroke="#D7E1EE" stroke-width="2"/>
<rect x="64" y="330" width="7" height="280" rx="0" fill="#2165D6" stroke="none" stroke-width="2"/>
<text fill="#2165D6" font-family="Noto Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" xml:space="preserve">
<tspan x="89" y="385">CARACTERE</tspan>
</text>
<text fill="#182B45" font-family="Noto Sans,sans-serif" font-size="28" font-weight="400" text-anchor="start" xml:space="preserve">
<tspan x="89" y="458">O símbolo que lemos:</tspan>
<tspan x="89" y="492.72"></tspan>
<tspan x="89" y="527.44">7</tspan>
</text>
<rect x="578" y="330" width="445" height="280" rx="18" fill="#FFFFFF" stroke="#D7E1EE" stroke-width="2"/>
<rect x="578" y="330" width="7" height="280" rx="0" fill="#008774" stroke="none" stroke-width="2"/>
<text fill="#008774" font-family="Noto Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" xml:space="preserve">
<tspan x="603" y="385">BYTE EM HEX</tspan>
</text>
<text fill="#182B45" font-family="Noto Sans,sans-serif" font-size="28" font-weight="400" text-anchor="start" xml:space="preserve">
<tspan x="603" y="458">O código ASCII de “7”:</tspan>
<tspan x="603" y="492.72"></tspan>
<tspan x="603" y="527.44">0x37</tspan>
</text>
<text fill="#52657B" font-family="Noto Sans,sans-serif" font-size="40" font-weight="700" text-anchor="start" xml:space="preserve">
<tspan x="528" y="486">=</tspan>
</text>
<rect x="1092" y="330" width="444" height="280" rx="18" fill="#FFFFFF" stroke="#D7E1EE" stroke-width="2"/>
<rect x="1092" y="330" width="7" height="280" rx="0" fill="#2165D6" stroke="none" stroke-width="2"/>
<text fill="#2165D6" font-family="Noto Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" xml:space="preserve">
<tspan x="1117" y="385">BITS</tspan>
</text>
<text fill="#182B45" font-family="Noto Sans,sans-serif" font-size="28" font-weight="400" text-anchor="start" xml:space="preserve">
<tspan x="1117" y="458">O mesmo byte:</tspan>
<tspan x="1117" y="492.72"></tspan>
<tspan x="1117" y="527.44">00110111</tspan>
</text>
<text fill="#52657B" font-family="Noto Sans,sans-serif" font-size="40" font-weight="700" text-anchor="start" xml:space="preserve">
<tspan x="1042" y="486">=</tspan>
</text>
<rect x="64" y="693" width="1472" height="66" rx="14" fill="#EAF1FF" stroke="none" stroke-width="2"/>
<text fill="#2165D6" font-family="Noto Sans,sans-serif" font-size="26" font-weight="700" text-anchor="start" xml:space="preserve">
<tspan x="88" y="735">AES-128 usa uma chave de 128 bits e trabalha com blocos de 16 bytes.</tspan>
</text>
<line x1="64" y1="848" x2="1536" y2="848" stroke="#D7E1EE" stroke-width="1" />
<text fill="#52657B" font-family="Noto Sans,sans-serif" font-size="17" font-weight="700" text-anchor="start" xml:space="preserve">
<tspan x="65" y="878">AES-128 · AUGUSTO + GUSTAVO</tspan>
</text>
<text fill="#52657B" font-family="Noto Sans,sans-serif" font-size="18" font-weight="400" text-anchor="end" xml:space="preserve">
<tspan x="1536" y="877">04 / 27</tspan>
</text>
</svg>