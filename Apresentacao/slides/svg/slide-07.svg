<text fill="#2165D6" font-family="Noto Sans Mono,sans-serif" font-size="18" font-weight="700" text-anchor="start" xml:space="preserve">
<tspan x="82" y="357">pkcs7_ecb.c · dentro de pkcs7_preencher()</tspan>
</text>
<text fill="#182B45" font-family="Noto Sans Mono,sans-serif" font-size="27" font-weight="400" text-anchor="start" xml:space="preserve">
<tspan x="86" y="420">  const uint8_t falta = (uint8_t)(total - tamanho);  // 1..16</tspan>
<tspan x="86" y="453.48">  if (tamanho) memmove(saida, msg, tamanho);</tspan>
<tspan x="86" y="486.96">  memset(saida + tamanho, falta, falta);</tspan>
</text>
<rect x="64" y="556" width="1472" height="160" rx="18" fill="#F0F4FA" stroke="#D7E1EE" stroke-width="2"/>
