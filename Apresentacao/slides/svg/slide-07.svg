<tspan x="82" y="583">pkcs7_ecb.c · dentro de ecb_cifrar()</tspan>
</text>
<text fill="#182B45" font-family="Noto Sans Mono,sans-serif" font-size="27" font-weight="400" text-anchor="start" xml:space="preserve">
<tspan x="86" y="646">  for (size_t b = 0; b &lt; blocos; ++b)</tspan>
<tspan x="86" y="679.48">    aes128_cifrar_bloco(ctx, in + 16 * b, out + 16 * b);</tspan>
