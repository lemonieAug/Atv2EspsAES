<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AES-128 entre dois ESP32</title><style>body{margin:0;background:#e9eef5;font:16px Arial;color:#182b45;display:grid;place-items:center;min-height:100vh}main{width:min(100vw,1600px)}img{display:block;width:100%;aspect-ratio:16/9;background:white}nav{display:flex;gap:18px;align-items:center;justify-content:center;padding:14px}button{padding:9px 20px;background:white;border:1px solid #ccd7e4;border-radius:8px;color:#182b45;cursor:pointer}button:focus{outline:3px solid #2165d6}</style><main><img id="slide" alt="Slide da apresentação"><nav><button id="prev">Anterior</button><span id="count"></span><button id="next">Próximo</button><button id="full">Tela cheia</button></nav></main><script>const titles=["AES-128 entre dois ESP32","O que queremos mostrar?","Dois caminhos: UART para dados, USB para observar","Um texto também é uma sequência de números","A chave nasce das matrículas","O AES precisa de blocos completos","No código: completar e cifrar","O AES transforma um bloco em 10 rodadas","SubBytes: trocar cada byte por outro","ShiftRows: cada linha anda um pouco","MixColumns: uma coluna se mistura por dentro","AddRoundKey: a chave entra na transformação","Uma chave inicial gera as chaves das rodadas","O ciclo completo aparece neste trecho","Como B sabe onde a mensagem começa e termina?","Na placa B, o caminho acontece ao contrário","O que a turma verá nos dois monitores","Demonstração ao vivo: três passos","Como sabemos que o resultado está correto?","Um único bit muda muitos bits do resultado","Por que o ECB revela padrões?","Cifrar não garante que ninguém alterou os dados","O que conseguimos demonstrar","Apoio: os cinco estados do primeiro bloco","Apoio: a decifragem desfaz o caminho","Apoio: encontre a resposta que não chegou","Fontes e preparação final"];let i=0;function show(){document.querySelector('#slide').src='svg/slide-'+String(i+1).padStart(2,'0')+'.svg';document.querySelector('#slide').alt=(i+1)+'. '+titles[i];document.querySelector('#count').textContent=(i+1)+' / '+titles.length;document.querySelector('#prev').disabled=i===0;document.querySelector('#next').disabled=i===titles.length-1;}function move(n){i=Math.max(0,Math.min(titles.length-1,i+n));show();}document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.querySelector('#full').onclick=()=>document.documentElement.requestFullscreen();document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();move(1);}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();move(-1);}if(e.key==='Home'){i=0;show();}if(e.key==='End'){i=titles.length-1;show();}});show();</script></html>
